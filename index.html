function applyFilters(items){if(typeof window.__applyAllFilters==='function')return window.__applyAllFilters(items);const q=norm(state.query);return items.filter(item=>{

if(state.view==='brands')render();else if(state.brand)renderPerfumeList(applyFilters(DATA.filter(i=>i.brand===state.brand)),state.brand);}

function openCard(item){

/* ============ СВАЙП ВНИЗ ДЛЯ ЗАКРЫТИЯ ШТОРКИ ============ */
(function(){
  const sheet = document.getElementById('bottomSheet');
  if (!sheet) return;
  let startY = 0, currentY = 0, isDragging = false;
  
  sheet.addEventListener('touchstart', function(e){
    if (sheet.scrollTop > 0) { isDragging = false; return; }
    startY = e.touches[0].clientY;
    currentY = startY;
    isDragging = true;
    sheet.style.transition = 'none';
  }, {passive:true});
  
  sheet.addEventListener('touchmove', function(e){
    if (!isDragging) return;
    currentY = e.touches[0].clientY;
    const diff = currentY - startY;
    if (diff > 0) {
      sheet.style.transform = 'translateY(' + diff + 'px)';
    }
  }, {passive:true});
  
  sheet.addEventListener('touchend', function(){
    if (!isDragging) return;
    isDragging = false;
    const diff = currentY - startY;
    sheet.style.transition = '';
    if (diff > 80) {
      sheet.style.transform = '';
      closeCard();
    } else {
      sheet.style.transform = '';
    }
  });
})();

<script>
/* Мультисловный поиск (AND) — "tom ford lost cherry" найдёт всё где есть эти 4 слова */
(function(){
  window.applyFilters = function(items){
    var q = norm(state.query);
    var words = q.split(/\s+/).filter(Boolean);
    return items.filter(function(item){
      if(state.filter==='women'&&item.gender!=='women')return false;
      if(state.filter==='men'&&item.gender!=='men')return false;
      if(state.filter==='unisex'&&item.gender!=='unisex')return false;
      if(state.filter==='sale'&&!item.sale)return false;
      if(state.filter==='new'){var y=parseInt(item.year);if(!y||y<2024)return false;}
      if(state.filter==='hits'){
        var full=(item.brand+' '+item.name).toLowerCase();
        var isHit=false;
        for(var i=0;i<HITS.length;i++){
          var hn=HITS[i].toLowerCase();
          if(full===hn||item.name.toLowerCase()===hn||full.includes(hn)||hn.includes(item.name.toLowerCase())){isHit=true;break;}
        }
        if(!isHit)return false;
      }
      if(state.collectionFilter&&state.collectionFilter!=='all'&&item.collection!==state.collectionFilter)return false;
      if(words.length){
        var hay=norm(item._searchText||(item.brand+' '+item.name+' '+(item.notesTop||'')+' '+(item.notesHeart||'')+' '+(item.notesBase||'')));
        for(var j=0;j<words.length;j++){
          if(hay.indexOf(words[j])===-1)return false;
        }
      }
      return true;
    });
  };
})();
</script>


<script>
(function(){
  var phrases = [
    "Tom Ford Lost Cherry...",
    "Memo Marfa...",
    "Dior Sauvage...",
    "Creed Aventus...",
    "Ваниль...",
    "Мускус...",
    "Уд и шафран...",
    "Что найдём?"
  ];
  var input = document.getElementById('search');
  if(!input) return;
  
  var phraseIdx = 0;
  var charIdx = 0;
  var isDeleting = false;
  var isPaused = false;
  var userTyped = false;
  
  // Останавливаем анимацию когда пользователь начинает печатать сам
  input.addEventListener('input', function(){
    if(input.value.length > 0){
      userTyped = true;
    }
  });
  input.addEventListener('blur', function(){
    if(input.value.length === 0){
      userTyped = false;
    }
  });
  input.addEventListener('focus', function(){
    // Пока пользователь в поле — не мешаем анимацией
    userTyped = true;
  });
  
  var basePlaceholder = 'Поиск...';
  
  function tick(){
    if(userTyped || document.activeElement === input){
      input.placeholder = basePlaceholder;
      setTimeout(tick, 500);
      return;
    }
    
    var current = phrases[phraseIdx];
    
    if(isPaused){
      isPaused = false;
      setTimeout(tick, 1600);
      return;
    }
    
    if(!isDeleting){
      // Печатаем
      charIdx++;
      input.placeholder = current.substring(0, charIdx);
      if(charIdx >= current.length){
        isDeleting = true;
        isPaused = true;
        setTimeout(tick, 1600);
        return;
      }
      setTimeout(tick, 70 + Math.random() * 50);
    } else {
      // Стираем
      charIdx--;
      input.placeholder = current.substring(0, charIdx);
      if(charIdx <= 0){
        isDeleting = false;
        charIdx = 0;
        phraseIdx = (phraseIdx + 1) % phrases.length;
        setTimeout(tick, 400);
        return;
      }
      setTimeout(tick, 35);
    }
  }
  
  setTimeout(tick, 1500);
})();
</script>

<script>
/* LIVE FILTERS v2 — colored + working */
(function(){
  function getChecked(type){
    var all = document.querySelectorAll('input[data-filter="' + type + '"]:checked');
    var vals = [];
    for (var i = 0; i < all.length; i++) vals.push(all[i].value);
    return vals;
  }
  window.__applyAllFilters = function(items){
    var genders = getChecked('gender');
    var categories = getChecked('category');
    var collections = getChecked('collection');
    var q = (typeof state !== 'undefined' && state.query) ? state.query.toLowerCase().trim() : '';
    var words = q.split(/\s+/).filter(Boolean);
    return items.filter(function(item){
      if (genders.length > 0 && genders.indexOf(item.gender) === -1) return false;
      if (categories.length > 0){
        var ok = false;
        for (var i = 0; i < categories.length; i++){
          var cat = categories[i];
          if (cat === 'sale' && item.sale) { ok = true; break; }
          if (cat === 'new'){ var y = parseInt(item.year); if (y && y >= 2024) { ok = true; break; } }
          if (cat === 'hits'){
            var full = (item.brand + ' ' + item.name).toLowerCase();
            var hits = (typeof HITS !== 'undefined' && HITS) ? HITS : (window.HITS || []);
            for (var j = 0; j < hits.length; j++){
              var hn = hits[j].toLowerCase();
              if (full === hn || item.name.toLowerCase() === hn || full.indexOf(hn) !== -1 || hn.indexOf(item.name.toLowerCase()) !== -1){ ok = true; break; }
            }
            if (ok) break;
          }
        }
        if (!ok) return false;
      }
      if (collections.length > 0){
        var coll = item.collection || 'classic';
        if (collections.indexOf(coll) === -1) return false;
      }
      if (words.length > 0){
        var hay = (item._searchText || (item.brand + ' ' + item.name + ' ' + (item.notesTop||'') + ' ' + (item.notesHeart||'') + ' ' + (item.notesBase||''))).toLowerCase();
        for (var k = 0; k < words.length; k++){
          if (hay.indexOf(words[k]) === -1) return false;
        }
      }
      return true;
    });
  };

  function colorLabel(label){
    var inp = label.querySelector('input');
    if (!inp) return;
    var type = inp.dataset.filter;
    var val = inp.value;
    var checked = inp.checked;
    label.className = 'check';
    if (checked) label.classList.add('active-' + type + '-' + val);
  }
  function updateAllLabels(){
    document.querySelectorAll('.check').forEach(colorLabel);
  }

  document.addEventListener('change', function(e){
    console.log('[BF-DEBUG] change fired:', e.target);
    if (e.target && e.target.matches && e.target.matches('input[data-filter]')){
      console.log('[BF-DEBUG] checkbox:', e.target.value, 'checked:', e.target.checked);
      updateAllLabels();
      var _f = window.__applyAllFilters(DATA);
      console.log('[BF-DEBUG] filtered:', _f.length, 'of', DATA.length);
      if (typeof render === 'function') {
        console.log('[BF-DEBUG] render exists, calling');
        render();
      } else {
        console.log('[BF-DEBUG] NO render function!');
      }
    }
  });

  // Подмена applyFilters — сразу, как только появится
  (function attach(){
    if (typeof window.applyFilters === 'function' || typeof state !== 'undefined'){
      window.applyFilters = function(items){ return window.__applyAllFilters(items); };
      updateAllLabels();
      if (typeof render === 'function') render();
      return;
    }
    setTimeout(attach, 30);
  })();
})();
</script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  var sheet=document.getElementById('bottomSheet');
  if(!sheet)return;
  var startY=0,startT=0,currY=0,dragging=false;
  sheet.addEventListener('touchstart',function(e){
    if(sheet.scrollTop>0)return;
    startY=e.touches[0].clientY;startT=Date.now();currY=startY;dragging=true;
  },{passive:true});
  sheet.addEventListener('touchmove',function(e){
    if(!dragging)return;
    currY=e.touches[0].clientY;
    var diff=currY-startY;
    if(diff>0&&sheet.scrollTop<=0){
      e.preventDefault();
      sheet.style.transform='translateY('+diff+'px)';
    }
  },{passive:false});
  sheet.addEventListener('touchend',function(){
    if(!dragging)return;
    dragging=false;
    var diff=currY-startY;
    var time=Date.now()-startT;
    var v=Math.abs(diff)/Math.max(time,1);
    sheet.style.transform='';
    if(diff>80||(diff>40&&v>0.5)){
      closeCard();
    }
    startY=0;currY=0;
  });
});

<script>
/* ========== УЛУЧШЕНИЯ ========== */

/* --- 2. Буквенный указатель --- */
function buildAlphaNav(){
  var grid=document.getElementById('brandGrid');
  var wrap=document.getElementById('viewBrands');
  if(!grid||!wrap)return;
  var old=document.querySelector('.alpha-nav');
  if(old)old.remove();
  var tiles=grid.querySelectorAll('.brand-tile');
  if(tiles.length<15)return;
  var letters={};
  tiles.forEach(function(t){
    var nameEl=t.querySelector('.brand-tile-name');
    if(!nameEl)return;
    var first=nameEl.textContent.trim().charAt(0).toUpperCase();
    if(!letters[first])letters[first]=t;
  });
  var keys=Object.keys(letters).sort();
  var nav=document.createElement('div');
  nav.className='alpha-nav';
  keys.forEach(function(letter){
    var s=document.createElement('span');
    s.textContent=letter;
    s.dataset.letter=letter;
    s.onclick=function(){
      var target=letters[letter];
      if(target){
        var y=target.getBoundingClientRect().top+window.pageYOffset-120;
        window.scrollTo({top:y,behavior:'smooth'});
      }
    };
    nav.appendChild(s);
  });
  document.body.appendChild(nav);

  /* Подсветка активной буквы при скролле */
  var timeout=null;
  window.addEventListener('scroll',function(){
    if(timeout)return;
    timeout=setTimeout(function(){
      timeout=null;
      var vis=[];
      Object.keys(letters).forEach(function(l){
        var r=letters[l].getBoundingClientRect();
        if(r.top<200&&r.bottom>-50)vis.push(l);
      });
      if(vis.length){
        nav.querySelectorAll('span').forEach(function(s){
          s.classList.toggle('active',s.dataset.letter===vis[vis.length-1]);
        });
      }
    },100);
  },{passive:true});
}

/* --- 3. Сортировка брендов: по количеству / по алфавиту --- */
var sortByCount=false;
function applySort(){
  var grid=document.getElementById('brandGrid');
  if(!grid)return;
  var tiles=Array.from(grid.querySelectorAll('.brand-tile'));
  if(!tiles.length)return;
  if(sortByCount){
    tiles.sort(function(a,b){
      var ca=parseInt(a.querySelector('.brand-tile-count').textContent)||0;
      var cb=parseInt(b.querySelector('.brand-tile-count').textContent)||0;
      if(cb!==ca)return cb-ca;
      return a.querySelector('.brand-tile-name').textContent.localeCompare(b.querySelector('.brand-tile-name').textContent,'ru');
    });
  }else{
    tiles.sort(function(a,b){
      return a.querySelector('.brand-tile-name').textContent.localeCompare(b.querySelector('.brand-tile-name').textContent,'ru');
    });
  }
  tiles.forEach(function(t){grid.appendChild(t);});
}
function addSortToggle(){
  var f=document.getElementById('filters');
  if(!f)return;
  if(f.querySelector('.sort-toggle'))return;
  var b=document.createElement('div');

    sortByCount=!sortByCount;
    b.innerHTML=(sortByCount?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M6 12h12M10 18h4"/></svg> Топ':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M6 12h12M10 18h4"/></svg> А-Я');
    applySort();
  };
  f.appendChild(b);
}
